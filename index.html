
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<table border="4">
    <tr>

       
        <td>
            <fieldset>
                <h4>General Information</h4>

                <table>
                    <tr>
                        <td>First Name :</td>
                        <td><input type="text" placeholder="First Name"></td>
                    </tr>

                    <tr>
                        <td>Last Name :</td>
                        <td><input type="text" placeholder="Last Name"></td>
                    </tr>

                    <tr>
                        <td>Gender :</td>
                        <td>
                            <select>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Father's Name :</td>
                        <td><input type="text" placeholder="Father's Name"></td>
                    </tr>

                    <tr>
                        <td>Mother's Name :</td>
                        <td><input type="text" placeholder="Mother's Name"></td>
                    </tr>

                    <tr>
                        <td>Blood Group :</td>
                        <td>
                            <select>
                                <option value="">Select Blood Group</option>
                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Religion :</td>
                        <td>
                            <select>
                                <option value="">Select Religion</option>
                                <option>Hindu</option>
                                <option>Islam</option>
                                <option>Christian</option>
                                <option>Buddhist</option>
                                <option>Other</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </td>


       
        <td>
            <fieldset>
                <h4>Contact Information</h4>

                <table>
                    <tr>
                        <td>Email :</td>
                        <td><input type="email" placeholder="Email"></td>
                    </tr>

                    <tr>
                        <td>Phone/Mobile :</td>
                        <td><input type="tel" placeholder="Phone Number"></td>
                    </tr>

                    <tr>
                        <td>Website :</td>
                        <td><input type="url" placeholder="Website"></td>
                    </tr>
                </table>

                <fieldset>
                    <h4>Present Information</h4>

                    <table>
                        <tr>
                            <td>Country :</td>
                            <td>
                                <select>
                                    <option>Bangladesh</option>
                                    <option>India</option>
                                    <option>Other</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>Division :</td>
                            <td>
                                <select>
                                    <option>Dhaka</option>
                                    <option>Chattogram</option>
                                    <option>Rajshahi</option>
                                    <option>Khulna</option>
                                    <option>Barishal</option>
                                    <option>Sylhet</option>
                                    <option>Rangpur</option>
                                    <option>Mymensingh</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>Address :</td>
                            <td>
                                <input type="text" placeholder="Road/Street/City">
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </fieldset>
        </td>


       
        <td>
            <fieldset>
                <h4>Account Information</h4>

                <table>
                    <tr>
                        <td>Username :</td>
                        <td><input type="text" placeholder="Username"></td>
                    </tr>

                    <tr>
                        <td>Password :</td>
                        <td><input type="password" placeholder="Password"></td>
                    </tr>

                    <tr>
                        <td>Confirm Password :</td>
                        <td><input type="password" placeholder="Confirm Password"></td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <button">
                               <a href="wellcome.html"> Register</a>
                            </button>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </td>

    </tr>
</table>

</body>
</html>
